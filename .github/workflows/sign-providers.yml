name: Sign Providers

on:
  workflow_dispatch:
  push:
    paths:
      - 'github/providers/**'
      - 'tools/sign-providers.js'

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Sign provider sources
        env:
          PROVIDER_SIGNING_PRIVATE_KEY: ${{ secrets.PROVIDER_SIGNING_PRIVATE_KEY }}
          PROVIDER_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main/
        run: node tools/sign-providers.js

      - name: Verify signatures
        run: node tools/verify-provider-signatures.js

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github/provider-signatures.json
          if git diff --cached --quiet; then
            echo "No signature changes."
            exit 0
          fi
          git commit -m "chore: sign provider sources"
          git push
